name: Daily Digest

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST daily (cron is UTC; IST = UTC+5:30)
  workflow_dispatch: {}     # lets you manually trigger a run from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build_digest.py

      - name: Commit updated data
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "chore: daily digest $(date -u +%F)"
          git push
